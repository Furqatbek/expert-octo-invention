function priceTable(){
  const all=[...S.products.values()];
  const list=[...S.products.entries()].filter(([id,p])=>(S.prcat==='all'||p.cat===S.prcat)&&brandOk(p,S.prbrand)&&matchQ(p,S.prq)).sort(byName);
  let tc=0,tp=0;
  const rows=list.map(([id,p])=>{
    const liq=isLiquid(p);
    const cost=liq?bottleCost(p):num(p.cost), price=liq?num(p.priceBottle):num(p.price), prof=price-cost;
    const vc=liq?Math.max(0,num(p.sealed))*bottleCost(p)+Math.max(0,num(p.openMl))*costMl(p):Math.max(0,num(p.qty))*num(p.cost);
    const vp=liq?Math.max(0,num(p.sealed))*num(p.priceBottle)+Math.max(0,num(p.openMl))*num(p.priceMl):Math.max(0,num(p.qty))*num(p.price);
    tc+=vc; tp+=vp;
    const stock=liq?q1(p.sealed)+' sh'+(num(p.openMl)?' · '+q1(p.openMl)+' ml':''):q1(p.qty)+' dona';
    return '<tr><td class="mintd"><button class="tname" type="button" data-act="edit-product" data-arg="'+esc(id)+'">'+esc(p.name)+'</button>'+(p.brand?'<div class="tsub">'+esc(p.brand)+'</div>':'')+'</td><td>'+esc(catLabel(p.cat))+'</td><td class="n">'+stock+'</td><td class="n">'+money(cost)+'</td><td class="n">'+money(price)+'</td><td class="n '+(prof<0?'bad':'good')+'">'+money(prof)+'</td><td class="n">'+pct(prof,price)+'</td><td class="n">'+(liq?money(p.priceMl):'<span class="muted">—</span>')+'</td><td class="n">'+money(vc)+'</td><td class="n">'+money(vp)+'</td></tr>';
  }).join('');
  let h='<section class="pane wide"><div class="row between"><h3 class="h-sm">Mahsulot narxlari</h3><span class="hint">'+list.length+' ta mahsulot · hozirgi narx va qoldiq</span></div>';
  h+='<div class="row">'+searchBox('pr-q','prq',S.prq,'Mahsulot qidirish')+'</div><div class="filtrow">'+brandSelect('prbrand',all.filter(p=>S.prcat==='all'||p.cat===S.prcat))+catChips('prcat',all.filter(p=>brandOk(p,S.prbrand)))+'</div>';
  if(!list.length) return h+'<div class="muted" style="font-size:13.5px">'+(all.length?'Hech narsa topilmadi.':'Hali mahsulot yoʻq.')+'</div></section>';
  h+='<div class="tablewrap tall"><table><thead><tr><th>Mahsulot</th><th>Turi</th><th class="n">Qoldiq</th><th class="n">Tannarx</th><th class="n">Sotuv narxi</th><th class="n">Foyda</th><th class="n">Marja</th><th class="n">1 ml narxi</th><th class="n">Qoldiq (tannarxda)</th><th class="n">Qoldiq (sotuv narxida)</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="8">Jami</td><td class="n">'+money(tc)+'</td><td class="n">'+money(tp)+'</td></tr></tfoot></table></div><span class="hint">Atirlar uchun tannarx, narx va foyda 1 shisha uchun koʻrsatilgan. Nomini bossangiz, mahsulot ochiladi.</span></section>';
  return h;
}

function viewSheet(){
  const sh=S.sheet; let body, center=false;
  if(sh.kind==='pick'){ body=sheetPick(sh); center=true; }
  else if(sh.kind==='cart'){ body='<div class="sheet-head"><span class="disp">Savat</span><button class="btn ghost" type="button" data-act="close">Yopish</button></div><div class="sheet-body">'+cartBody()+'</div>'; center=true; }
  else if(sh.kind==='product') body=sheetProduct(sh);
  else if(sh.kind==='material') body=sheetMaterial(sh);
  else if(sh.kind==='recipe') body=sheetRecipe(sh);
  else if(sh.kind==='batch'){ body=sheetBatch(sh); center=true; }
  else if(sh.kind==='expense'){ body=sheetExpense(sh); center=true; }
  else if(sh.kind==='types') body=sheetTypes(sh);
  else if(sh.kind==='order') body=sheetOrder(sh);
  return '<div class="overlay'+(center?' center':'')+'" data-act="bg-close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'+body+'</div></div>';
}

async function receiveOrder(id){
  const o=S.orders.get(id); if(!o||o.status==='received') return;
  const mats=[];
  for(const l of (o.lines||[])){
    const n=num(l.qty), c=num(l.cost);
    if(l.type==='product'){
      const p=S.products.get(l.id); if(!p) continue;
      if(isLiquid(p)){ const bm=num(p.bottleMl), old=Math.max(0,num(p.openMl))+Math.max(0,num(p.sealed))*bm, tot=old+n*bm; await patchProduct(l.id,{sealed:num(p.sealed)+Math.floor(n),costMl:rnd(tot>0?(old*num(p.costMl)+n*c)/tot:c/(bm||1))}); }
      else { const old=Math.max(0,num(p.qty)); await patchProduct(l.id,{qty:num(p.qty)+Math.floor(n),cost:rnd(old+n>0?(old*num(p.cost)+n*c)/(old+n):c)}); }
    } else {
      const m=S.materials.get(l.id); if(!m) continue; const old=Math.max(0,num(m.stock));
      mats.push({mid:l.id,delta:n,type:'in',note:'Buyurtma'+(o.supplier?' · '+o.supplier:''),cost:(old+n)>0?(old*num(m.cost)+n*c)/(old+n):c});

  await moveMats(mats);
  const fl={status:'received',receivedDay:dayKey(),receivedT:new Date().toISOString()};
  S.orders.set(id,Object.assign({},S.orders.get(id),fl)); await retry(()=>DB.doc('orders/'+id).update(fl));
}

/* ---------- image upload ---------- */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); const to=setTimeout(()=>rej(new Error('timeout')),3000); i.onload=()=>{ clearTimeout(to); res(i); }; i.onerror=()=>{ clearTimeout(to); rej(new Error('load')); }; i.src=url; });
    const max=640, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.75));
  }catch(e){ return file; }
  finally{ URL.revokeObjectURL(url); }
}
async function uploadImage(file){
  if(!file) return;
  if(!canWrite()){ toast('Bu doʻkonni faqat koʻra olasiz, oʻzgartira olmaysiz.','bad'); return; }
  try{ if(!ASSETS) ASSETS=await window.claude.use('assets'); }catch(e){ ASSETS=null; }
  if(!ASSETS){ toast('Rasmni faqat doʻkon egasi yoki muharrir qoʻsha oladi.','bad'); return; }
  S.uploading=true; render();
  try{
    const blob=await shrink(file);
    let res; try{ res=await ASSETS.upload(blob); }catch(e){ if(e&&e.code==='store_unavailable'){ await sleep(600); res=await ASSETS.upload(blob); } else throw e; }
    if(S.sheet&&S.sheet.kind==='product'){ S.sheet.d.img=res.id; }
  }catch(e){ toast('Rasm yuklanmadi. Kichikroq JPG yoki PNG fayl tanlang.','bad'); }
  finally{ S.uploading=false; render(); }
}

/* ---------- tooltip ---------- */
const tipEl=document.getElementById('tip');
function hideTip(){ tipEl.hidden=true; }
function showTip(el,x,y){
  let d; try{ d=JSON.parse(el.getAttribute('data-tip')); }catch(e){ return; }
  tipEl.textContent='';
  const t=document.createElement('div'); t.className='tt'; t.textContent=d.t; tipEl.appendChild(t);
  (d.rows||[]).forEach(r=>{ const row=document.createElement('div'); row.className='tr'; const i=document.createElement('i'); if(r[0]) i.style.background='var(--'+r[0]+')'; const b=document.createElement('b'); b.textContent=r[2]; const s=document.createElement('span'); s.textContent=r[1]; row.appendChild(i); row.appendChild(b); row.appendChild(s); tipEl.appendChild(row); });
  tipEl.hidden=false;
  const w=tipEl.offsetWidth, h=tipEl.offsetHeight, vw=window.innerWidth;
  let left=x+14, top=y-h-12; if(left+w>vw-8) left=x-w-14; if(left<8) left=8; if(top<8) top=y+16;
  tipEl.style.left=left+'px'; tipEl.style.top=top+'px';
}
document.addEventListener('pointermove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else if(!tipEl.hidden) hideTip(); });
document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left+r.width/2,r.top); } });
document.addEventListener('focusout',()=>hideTip());

function listen(ref,key,onDocs){
  return ref.onSnapshot(snap=>{ onDocs(snap); S.got[key]=true; if(!snap.metadata.fromCache){ S.fresh[key]=true; freshCheck(); } render(); },
    err=>{ S.got[key]=true; S.fresh[key]=true; freshCheck(); if(err&&err.code==='revoked') S.dead=true; else toast('Doʻkon maʼlumotlari yangilanmay qoldi. Qayta ulanish uchun sahifani yangilang.','bad'); render(); });
}
async function init(){
  render();
  slowTimer=setTimeout(()=>{ S.slow=true; render(); },10000);
  let db=null; try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(!db){ S.noDb=true; clearTimeout(slowTimer); render(); return; }
  DB=db;
  try{ const user=await window.claude.use('user'); if(user){ const c=await user.can('data.write'); if(c===false) S.readOnly=true; } }catch(e){}
  listen(DB.collection('products'),'p',snap=>{ S.products=new Map(snap.docs.map(d=>[d.id,fixNums(d.data(),['sealed','openMl','qty'])])); });
  listen(DB.collection('materials'),'m',snap=>{ S.materials=new Map(snap.docs.map(d=>[d.id,fixNums(d.data(),['stock'])])); });
  if(isSeller()){ S.got.e=S.got.o=true; S.fresh.e=S.fresh.o=true; } else listen(DB.collection('expenses').where('day','>=',addDays(dayKey(),-800)),'e',snap=>{ S.expenses=new Map(snap.docs.map(d=>[d.id,d.data()])); });
  if(!isSeller()) listen(DB.collection('orders'),'o',snap=>{ S.orders=new Map(snap.docs.map(d=>[d.id,d.data()])); });
  listen(DB.collection('debts'),'d',snap=>{ S.debts=new Map(snap.docs.map(d=>[d.id,d.data()])); });
  listen(DB.collection('sales').where('day','>=',addDays(dayKey(),isSeller()?-1:-400)),'s',snap=>{ S.sales=new Map(snap.docs.map(d=>[d.id,d.data()])); });
  DB.doc('settings/types').onSnapshot(snap=>{ S.types=snap.exists?((snap.data()||{}).list||[]):[]; setTypes(S.types); render(); },()=>{});
  DB.doc('settings/shop').onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); S.settings={name:d.name||'',currency:d.currency||"soʻm"}; } const a=document.activeElement; if(!a||(a.id!=='set-name'&&a.id!=='set-cur')) S.setDraft=null; render(); },()=>{});
}
document.documentElement.lang='uz';
window.SP_render=render;
(window.SP_READY||Promise.resolve()).then(init);
})();
</script>
</body>
