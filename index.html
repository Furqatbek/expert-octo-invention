<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131017" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shokh Parfume">
<title>Shokh Parfume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a till. Product tiles on the left, the cart on the right (a bottom bar on phones); porcelain ground, amber marks perfume levels */
:root{
  --bg:#F1EFF4; --surface:#FFFFFF; --sunk:#EAE6EF; --ink:#1C1722; --muted:#655D70; --line:#DCD6E3;
  --accent:#995810; --accent-ink:#FFFFFF; --accent-soft:#F5E7D4; --liquid:#C68629; --glass:#ECE8F1;
  --good:#2B774C; --bad:#B13348; --bad-soft:#F8DFE3; --warn:#76640A; --warn-soft:#F1EBC9;
  --s1:#2a78d6; --s2:#eb6834; --grid:#E6E2EB;
  --scrim:rgba(24,19,30,.48); --shadow:0 1px 2px rgba(28,23,34,.07),0 12px 32px rgba(28,23,34,.10);
  --f-disp:'Bodoni Moda','Bodoni 72','Didot',Georgia,serif;
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131017; --surface:#1C1822; --sunk:#27222E; --ink:#EEEAF3; --muted:#A79FB2; --line:#352E3E;
    --accent:#E4A24F; --accent-ink:#1F1406; --accent-soft:#3B2B18; --liquid:#D9973D; --glass:#2A2432;
    --good:#66C28D; --bad:#F07A8C; --bad-soft:#3D1B23; --warn:#D9C45F; --warn-soft:#302A12;
    --s1:#3987e5; --s2:#d95926; --grid:#2C2633;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131017; --surface:#1C1822; --sunk:#27222E; --ink:#EEEAF3; --muted:#A79FB2; --line:#352E3E;
  --accent:#E4A24F; --accent-ink:#1F1406; --accent-soft:#3B2B18; --liquid:#D9973D; --glass:#2A2432;
  --good:#66C28D; --bad:#F07A8C; --bad-soft:#3D1B23; --warn:#D9C45F; --warn-soft:#302A12;
  --s1:#3987e5; --s2:#d95926; --grid:#2C2633;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.disp{font-family:var(--f-disp);font-weight:500}
.mn{white-space:nowrap}
.cu{font-size:.76em;opacity:.7}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px 18px;padding-block:10px}
.mark{font-family:var(--f-disp);font-style:italic;font-weight:500;font-size:28px;line-height:1;white-space:nowrap}
@media (max-width:400px){.mark{font-size:24px}}
.shopname{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:2px;margin-left:12px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.ordline{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.ordnums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) 40px;gap:8px;align-items:end}
@media (max-width:480px){.ordnums{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}.ordnums .sumf{display:none}}
.check{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.atomrow{display:grid;gap:8px;margin-top:10px}
.lines .atl{display:block}
.lines .atl b{font-weight:600;color:var(--accent)}
.flow{display:grid;gap:0}
.flow div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.flow div:first-child{border-top:0}
.flow b{font-family:var(--f-num);font-weight:500}
.flow .tot{font-weight:600}
.flow .tot b{font-size:16px}
.tab{appearance:none;border:0;background:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--accent-soft)}
.tab[aria-selected="true"] .ico{color:var(--accent)}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.status.warn .dot{background:var(--warn)}
.botnav{display:none}
.tab .cnt{font-family:var(--f-num);font-size:11px;padding:1px 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);line-height:1.4}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.debts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.debt .nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.debt .ph{font-family:var(--f-num);font-size:13.5px;user-select:all}
.debt .its{font-size:13.5px;color:var(--muted)}
.debt.st-overdue{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px;border-radius:9px;background:var(--sunk)}
.kv3 div{display:grid;gap:1px}
.kv3 span{font-size:12px;color:var(--muted)}
.kv3 b{font-family:var(--f-num);font-weight:500;font-size:14px}
.debtbox{display:grid;gap:12px;padding:12px;border-radius:10px;background:var(--accent-soft)}
.between{justify-content:space-between}
.owed{font-size:14px;color:var(--muted)}
.owed b{font-family:var(--f-disp);font-size:24px;color:var(--ink);font-weight:500;margin-left:6px}
main{padding-block:18px 110px}
@media (max-width:860px){
  .tabs{display:none}
  .top-row{padding-block:10px}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .botnav .tab{flex:1;flex-direction:column;gap:3px;padding:8px 1px 9px;font-size:10.5px;border-radius:0;background:none;min-width:0}
  .botnav .tab[aria-selected="true"]{background:none;color:var(--accent)}
  .botnav .tab{position:relative}
  .botnav .cnt{position:absolute;top:3px;left:calc(50% + 6px);font-size:10px;padding:0 5px}
  main{padding-block:14px 150px}
}

/* generic */
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.h{font-family:var(--f-disp);font-size:24px;line-height:1.15}
.h-sm{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:16px}
.banner p{flex:1;min-width:220px}
.note{padding:9px 12px;border-radius:8px;font-size:13.5px;background:var(--sunk)}
.note.warn{background:var(--warn-soft)}
.note.info{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:32px 12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-weight:600;font-size:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],select{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
input[type=text]:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:9px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{width:100%;padding:15px 16px;font-size:17px;font-weight:600}
.btn.small{padding:7px 11px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;padding:10px 8px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.toolbar .row.prodacts{justify-content:flex-end}
@media (max-width:560px){.toolbar .row.prodacts>.btn{flex:1 1 auto}}
.filtrow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.filtrow>*{min-width:0}
@media (min-width:700px){.filtrow>.chips{flex-wrap:wrap;overflow-x:visible}}
.bsel{position:relative;display:block;width:100%}
.bsel select{appearance:none;-webkit-appearance:none;width:100%;max-width:100%;font-size:16px;line-height:1.25;padding:11px 40px 11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;text-overflow:ellipsis}
.bsel select:hover{color:var(--ink)}
.bsel::after{content:'';position:absolute;right:16px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.bsel.on select{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);font-weight:600}
.bsel.on::after{border-color:var(--accent)}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.c-original{background:var(--accent-soft);color:var(--accent)}
.pill.c-handmade{background:transparent;box-shadow:inset 0 0 0 1px var(--muted);color:var(--ink)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.neg{background:var(--bad-soft);color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:14px}
.toolbar>*{min-width:0}
.toolbar .row{flex-wrap:nowrap}
.toolbar .row.between{flex-wrap:wrap}
.toolbar .row.between>.chips{min-width:0;flex:1 1 260px}
.kv3 .mn{white-space:normal}
.tname{appearance:none;border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:500;cursor:pointer;color:var(--ink);overflow-wrap:anywhere}
.tname:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.tsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kr{padding:11px 0;border-top:1px solid var(--line)}
.kr:first-child{border-top:0;padding-top:2px}
.kh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kh b{font-weight:600}
.kd{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.lp th:first-child,.lp td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.lp thead th:first-child{z-index:2}
td.mintd{min-width:180px}
.tablewrap.tall{max-height:560px;overflow:auto}
.tablewrap.tall thead th{position:sticky;top:0;z-index:1;background:var(--surface)}
.tablewrap tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:600;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .nm{font-weight:500;overflow-wrap:anywhere}
.trow .sub{font-size:12.5px;color:var(--muted)}
.gauge{height:5px;background:var(--glass);border-radius:3px;overflow:hidden}
.gauge>i{display:block;height:100%;background:var(--liquid);border-radius:3px}

/* thumbs */
.thumb{display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--sunk);position:relative;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-style:italic;font-size:30px;color:var(--muted)}
.thumb.c-original{background:var(--accent-soft)} .thumb.c-original .mono{color:var(--accent)}
.thumb.c-handmade{background:linear-gradient(160deg,var(--accent-soft),var(--sunk))}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 8px 12px;display:grid;gap:8px;cursor:pointer;color:var(--ink);min-width:0;align-content:start}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.99)}
.tile .nm{font-weight:500;line-height:1.25;overflow-wrap:anywhere;padding-inline:4px}
.tile .sub{font-size:12.5px;color:var(--muted);padding-inline:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .pr{font-family:var(--f-num);font-size:13.5px;padding-inline:4px}
.tile .st{font-size:12.5px;color:var(--muted);padding-inline:4px;display:grid;gap:4px}
.tile .incart{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}

/* sell layout */
.sell{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:861px){.sell{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.cartcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px;max-height:calc(100vh - 96px);overflow:auto}}
@media (max-width:860px){.cartcol .cartpane{display:none}}
.cartpane{gap:14px}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.lines .thumb{width:44px;border-radius:8px}
.lines .thumb .mono{font-size:16px}
.lines .nm{font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.lines .dt{font-size:12.5px;color:var(--muted)}
.lines .w{font-size:12px;color:var(--warn)}
.lines .w.err{color:var(--bad);font-weight:500}
.tile.out,.tile.out:hover,.card.out,.card.out:hover{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.tile.low,.tile.low:hover,.card.low,.card.low:hover{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.tile.out{background:var(--sunk)}
.tile.out .thumb{filter:grayscale(1);opacity:.6}
.tile.out .nm,.tile.out .pr{color:var(--muted)}
.tile .outtag{justify-self:start;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 9px}
.tile .outtag.low{color:var(--warn);background:var(--warn-soft)}
.pill.out{color:var(--bad);background:var(--bad-soft)}
.lines .pr{text-align:right;font-family:var(--f-num);font-size:14px}
.qty{display:inline-flex;align-items:center;gap:2px;margin-top:6px}
.qty button{appearance:none;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.qty span{min-width:74px;padding:0 6px;text-align:center;font-family:var(--f-num);font-size:13.5px}
.rm{appearance:none;border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total b{font-family:var(--f-disp);font-size:30px;line-height:1}
.sumrow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sumrow span:last-child{font-family:var(--f-num)}
.cartbar{display:none}
@media (max-width:860px){
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:24;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
  .cartbar .btn{width:100%;justify-content:space-between;padding:14px 18px;font-size:16px;box-shadow:var(--shadow)}
}
.receipts{list-style:none;margin:0;padding:0;display:grid}
.receipts li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.receipts li:first-child{border-top:0}
.receipts .t{font-family:var(--f-num);font-size:12.5px;color:var(--muted);padding-top:2px}
.receipts .it{font-size:13.5px;overflow-wrap:anywhere}

function authErr(e){
  const c=e&&e.code||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Email yoki parol notoʻgʻri.';
  if(/invalid-email/.test(c)) return 'Email notoʻgʻri yozilgan.';
  if(/too-many-requests/.test(c)) return 'Juda koʻp urinish. Birozdan keyin qayta urinib koʻring.';
  if(/network-request-failed/.test(c)) return 'Internet yoʻq. Ulanishni tekshiring.';
  if(/user-disabled/.test(c)) return 'Bu hisob oʻchirib qoʻyilgan.';
  if(/unauthorized-domain/.test(c)) return 'Bu sayt manzili Firebase’da ruxsat etilmagan. Authentication → Settings → Authorized domains boʻlimiga qoʻshing.';
  if(/api-key|invalid-api-key|configuration-not-found|operation-not-allowed/.test(c)) return 'Firebase sozlamasi notoʻgʻri yoki Email/Password kirish yoqilmagan.';

}

/* ---------- network / pending writes bar ---------- */
let pending=0, slowPend=null, persistOk=true;
function netBar(){
  let t='';
  if(!navigator.onLine) t='Internet yoʻq. Oʻzgarishlar shu qurilmada saqlanmoqda va internet qaytganda yuboriladi.'+(persistOk?'':' Sahifani yopmang.');
  else if(pending>0&&slowPend==='on') t='Maʼlumotlar yuborilmoqda…';
  net.textContent=t; net.hidden=!t;
}
window.addEventListener('online',netBar); window.addEventListener('offline',netBar);
function track(p){
  pending++; if(!slowPend) slowPend=setTimeout(()=>{ slowPend='on'; netBar(); },4000);
  const done=()=>{ pending--; if(pending<=0){ pending=0; if(slowPend&&slowPend!=='on') clearTimeout(slowPend); slowPend=null; } netBar(); };
  p.then(done,done); return p;
}
function mapErr(e){ const c=String(e&&e.code||'unknown').replace(/^firestore\//,'').replace(/-/g,'_'); const x=new Error(e&&e.message||c); x.code=c; x.orig=e; return x; }
function lateErr(e){ const x=mapErr(e); const el=document.getElementById('toast'); if(el){ el.textContent='Oldingi oʻzgarish serverga saqlanmadi ('+x.code+'). Sahifani yangilab tekshiring.'; el.className='toast bad'; el.hidden=false; setTimeout(()=>{ el.hidden=true; },7000); } }
// A write is stored locally at once; the server confirms later. Offline we do not wait for that.
function settle(p){
  const tracked=track(p);
  return new Promise((res,rej)=>{
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    tracked.then(v=>{ if(!done){ done=true; res(v); } },e=>{ if(!done){ done=true; rej(mapErr(e)); } else lateErr(e); });
    if(!navigator.onLine||slowPend==='on'){ setTimeout(fin,0); return; }
    const check=()=>{ if(done) return; if(!navigator.onLine||slowPend==='on') fin(); else setTimeout(check,500); };
    setTimeout(check,500);
  });
}

/* ---------- connection check: if the database never answers, find out why and say it plainly ---------- */
const MD={includeMetadataChanges:true};
const LP_KEY='sp-longpoll'; let LP=false; try{ LP=localStorage.getItem(LP_KEY)==='1'; }catch(e){}
const DIAG_MS=window.SP_DIAG_MS||15000;
let live=false, diagBusy=false, diagClosed=false, diagTimer=null, diagEl=null;

function listenErr(e){ if(!/permission/.test(String(e&&e.code||''))) return; if(SP.role==='seller') recheckAccess(); else problem('rules'); }
function watchLive(){ clearTimeout(diagTimer); diagTimer=setTimeout(()=>{ if(!live&&navigator.onLine) diagnose(); },DIAG_MS); }
window.addEventListener('online',()=>{ if(SP.user&&!live) watchLive(); });
function hideDiag(){ if(diagEl) diagEl.hidden=true; }
async function diagnose(){
  if(diagBusy||live) return; diagBusy=true;
  const cfg=readCfg()||{}, u=auth&&auth.currentUser; let tok='', st=0, j=null;
  try{ tok=u?await u.getIdToken():''; }catch(e){}
  try{ const r=await fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(cfg.projectId||'')+'/databases/(default)/documents/settings/meta',{headers:tok?{Authorization:'Bearer '+tok}:{},cache:'no-store'}); st=r.status; try{ j=await r.json(); }catch(e){} }catch(e){ st=-1; }
  diagBusy=false; if(live) return;

  if(st===-1) problem('net');
  else if(st===404&&/does not exist/i.test(msg)) problem('nodb');
  else if(st===403&&/has not been used|is disabled|SERVICE_DISABLED/i.test(msg+' '+code)) problem('api');
  else if(st===403) problem('rules');

/* ---------- Firestore wrapper with the app's API ---------- */
let fs=null, auth=null, META={};
const histSubs=new Map(); // "coll" -> Set of refresh(id) for old (out-of-window) docs
function touched(path){ const [c,id]=String(path).split('/'); const set=histSubs.get(c); if(set&&id) set.forEach(fn=>fn(id)); }
function wrapDoc(ref){
  const w=fn=>{ let p; try{ p=fn(); }catch(e){ return Promise.reject(mapErr(e)); } const r=settle(p); touched(ref.path); return r; };
  return {
    id:ref.id,
    set:(d,o)=>w(()=>o?ref.set(d,o):ref.set(d)),
    update:d=>w(()=>ref.update(d)),
    delete:()=>w(()=>ref.delete()),
    get:()=>ref.get(),
    onSnapshot:(next,err)=>ref.onSnapshot(MD,sn=>{ seen(sn); next(sn); },e=>{ listenErr(e); if(err) err(mapErr(e)); })
  };
}
/* Sales and expenses grow every day. Only the last LIVE_DAYS are listened to live; older days are read
   once from the server per device (and again weekly), then from this device's own cache: that keeps
   the daily free read limit far away even after years of sales. */
const LIVE_DAYS=70, HIST={sales:'day',expenses:'day'};
function dayMinus(n){ const d=new Date(); d.setDate(d.getDate()-n); const z=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function histListen(coll,field,from,next,err){
  const cut=dayMinus(LIVE_DAYS), KEY='sp-hist-'+coll;
  let old=new Map(), liveDocs=null, meta={fromCache:true,hasPendingWrites:false}, alive=true;
  const emit=()=>{ if(!alive||!liveDocs) return; const m=new Map(old); liveDocs.forEach(d=>m.set(d.id,d)); const docs=[...m.values()]; next({docs,size:docs.length,empty:!docs.length,forEach:fn=>docs.forEach(fn),docChanges:()=>[],metadata:meta}); };
  let flag={}; try{ flag=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ flag={}; }
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(flag)); }catch(e){} };
  const fresh=persistOk&&flag.from&&flag.from<=from&&flag.seen&&flag.seen>=cut&&flag.fullAt&&flag.fullAt>=dayMinus(7)&&(!META.restoredAt||flag.fullAt>META.restoredAt);
  const base=fs.collection(coll).where(field,'>=',from).where(field,'<',cut);
  const loadOld=async()=>{
    let snap=null;
    if(fresh){ try{ snap=await base.get({source:'cache'}); if(snap.size<(flag.n||0)) snap=null; }catch(e){ snap=null; } }
    if(!snap){ try{ snap=await base.get(); }catch(e){ snap=null; } if(snap&&!snap.metadata.fromCache){ flag.from=from; flag.fullAt=new Date().toISOString(); flag.n=snap.size; save(); } else if(snap) retryOnline(); }
    if(snap&&alive){ old=new Map(); snap.forEach(d=>old.set(d.id,d)); emit(); }
  };
  const retryOnline=()=>{ const h=()=>{ window.removeEventListener('online',h); if(alive) loadOld(); }; window.addEventListener('online',h); };
  loadOld();
  const refresh=id=>{ if(!old.has(id)) return; fs.doc(coll+'/'+id).get({source:'cache'}).then(d=>{ if(d.exists) old.set(id,d); else old.delete(id); emit(); }).catch(()=>{}); };
  if(!histSubs.has(coll)) histSubs.set(coll,new Set()); histSubs.get(coll).add(refresh);
  const unsub=fs.collection(coll).where(field,'>=',cut).onSnapshot(MD,sn=>{ seen(sn); liveDocs=sn.docs; meta=sn.metadata; if(!sn.metadata.fromCache){ flag.seen=today(); save(); } emit(); },e=>{ listenErr(e); if(err) err(mapErr(e)); });
  return ()=>{ alive=false; histSubs.get(coll).delete(refresh); unsub(); };
}
function wrapQ(q,meta){
  meta=meta||{coll:'',filters:[]};
  const sub=(nq,f)=>wrapQ(nq,{coll:meta.coll,filters:f?meta.filters.concat([f]):meta.filters});
  return {
    where:(f,op,v)=>sub(q.where(f,op,v),[f,op,v]),
    orderBy:(...a)=>sub(q.orderBy(...a)),
    limit:n=>sub(q.limit(n)),
    doc:id=>wrapDoc(q.doc(id)),
    get:()=>q.get(),
    onSnapshot:(next,err)=>{
      const h=HIST[meta.coll], f=meta.filters;
      if(h&&f.length===1&&f[0][0]===h&&f[0][1]==='>='&&String(f[0][2])<dayMinus(LIVE_DAYS)) return histListen(meta.coll,h,String(f[0][2]),next,err);
      return q.onSnapshot(MD,sn=>{ seen(sn); next(sn); },e=>{ listenErr(e); if(err) err(mapErr(e)); });
    }
  };
}
let DBW=null;
function makeDb(){ return { doc:p=>wrapDoc(fs.doc(p)), collection:p=>wrapQ(fs.collection(p),{coll:p,filters:[]}), inc:n=>firebase.firestore.FieldValue.increment(n), union:(...a)=>firebase.firestore.FieldValue.arrayUnion(...a), remove:(...a)=>firebase.firestore.FieldValue.arrayRemove(...a) }; }

/* ---------- photos: stored as small JPEGs in the "images" collection ---------- */
const IMG=new Map();
function dataToBlobUrl(d){
  try{ const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(d); if(!m) return d; const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([u],{type:m[1]||'image/jpeg'})); }catch(e){ return d; }
}
function cacheImg(id,d){ if(!id||!d) return; const old=IMG.get(id); if(old&&old.d===d) return; if(old&&old.u&&old.u.startsWith('blob:')) URL.revokeObjectURL(old.u); IMG.set(id,{d,u:dataToBlobUrl(d)}); }
let imgReady=false; const imgWant=new Set(), imgBusy=new Set(), imgGone=new Map(), imgErr=new Set();
SP.img=id=>{ const x=IMG.get(id); if(x) return x.u; if(id&&imgReady&&!imgBusy.has(id)&&!(imgGone.has(id)&&Date.now()-imgGone.get(id)<60000)&&!imgErr.has(id)){ imgWant.add(id); fetchImgs(); } return ''; };
let rq=0; function rerender(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; if(window.SP_render) window.SP_render(); }); }
let imgTimer=null;
function fetchImgs(){
  if(imgTimer) return;
  imgTimer=setTimeout(async()=>{
    imgTimer=null; const ids=[...imgWant]; imgWant.clear(); ids.forEach(i=>imgBusy.add(i));
    for(let i=0;i<ids.length;i+=8){
      await Promise.all(ids.slice(i,i+8).map(async id=>{
        try{ const d=await fs.doc('images/'+id).get(); if(d.exists&&d.data()&&d.data().d) cacheImg(id,d.data().d); else imgGone.set(id,Date.now()); }
        catch(e){ imgErr.add(id); }
        finally{ imgBusy.delete(id); }
      }));
      rerender();
    }
  },60);
}
window.addEventListener('online',()=>{ imgErr.clear(); rerender(); });
// photos already on this device cost nothing; only new ones are downloaded, once
function loadImages(){
  fs.collection('images').get({source:'cache'}).then(sn=>{ sn.forEach(d=>{ const v=d.data(); if(v&&v.d) cacheImg(d.id,v.d); }); },()=>{}).finally(()=>{ imgReady=true; rerender(); });
}
function readText(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f); }); }
function blobToData(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }

/* ---------- downloads ---------- */
function download(filename,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||(/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'application/json')});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.rel='noopener'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
}

/* ---------- the API the app asks for ---------- */
window.claude={ use: async name=>{
  await READY;

/* ---------- backup: export everything / import a file ---------- */
function toast(msg,bad){ const el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.className='toast'+(bad?' bad':''); el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{ el.hidden=true; },bad?6000:3000); }
SP.exportAll=async()=>{
  if(!fs) return;
  toast('Zaxira tayyorlanmoqda…');
  try{
    const out={shop:'Shokh Parfume',format:'shokh-parfume-backup-1',exported:new Date().toISOString()};
    if(!navigator.onLine){ toast('Zaxira uchun internet kerak.',true); return; }

    download('shokh-parfume-zaxira-'+today()+'.json',JSON.stringify(out),'application/json');

SP.importText=async(text)=>{
  let data; try{ data=JSON.parse(text); }catch(e){ toast('Bu fayl zaxira emas (JSON oʻqilmadi).',true); return false; }
  if(!data||typeof data!=='object'||typeof data.products!=='object'){ toast('Bu fayl Shokh Parfume zaxirasi emas.',true); return false; }
  const jobs=[]; let big=0; ['images'].concat(COLLS.filter(c=>c!=='images')).forEach(c=>{ const o=data[c]; if(o&&typeof o==='object') Object.entries(o).forEach(([id,doc])=>{ if(id&&doc&&typeof doc==='object'&&!Array.isArray(doc)&&!/\//.test(id)){ if(JSON.stringify(doc).length>1000000){ big++; return; } jobs.push([c,id,doc]); } }); });
  if(!jobs.length){ toast('Faylda maʼlumot yoʻq.',true); return false; }
  const np=Object.keys(data.products||{}).length, ni=Object.keys(data.images||{}).length;
  if(!window.confirm('Zaxiradan tiklash: '+np+' ta mahsulot, '+ni+' ta rasm, jami '+jobs.length+' ta yozuv.\n\nBir xil yozuvlar fayldagi bilan almashtiriladi. Davom etasizmi?')) return false;
  if(!navigator.onLine){ toast('Tiklash uchun internet kerak.',true); return false; }
  let batch=fs.batch(), ops=0, bytes=0, done=0;
  const flush=async()=>{ if(!ops) return; await batch.commit(); batch=fs.batch(); ops=0; bytes=0; };
  try{
    for(const [c,id,doc] of jobs){
      const sz=JSON.stringify(doc).length;
      if(ops>=400||bytes+sz>3500000) await flush();
      batch.set(fs.collection(c).doc(id),doc); ops++; bytes+=sz; done++;
      if(done%50===0) toast('Tiklanmoqda… '+done+' / '+jobs.length);
    }
    await flush();
    await fs.doc('settings/meta').set({restoredAt:new Date().toISOString()},{merge:true});
    Object.entries(data.images||{}).forEach(([id,d])=>{ if(d&&d.d) cacheImg(id,d.d); });
    toast('Tiklandi: '+np+' ta mahsulot, '+ni+' ta rasm'+(big?' · '+big+' ta juda katta yozuv oʻtkazib yuborildi':'')); rerender();
    setTimeout(()=>location.reload(),2500); return true;
  }catch(e){ const x=mapErr(e); toast('Tiklash toʻxtadi ('+done+' / '+jobs.length+'): '+(x.code==='permission_denied'?'ruxsat yoʻq':x.code)+'. Qayta urinib koʻring.',true); return false; }
};
// role = what the database rules allow: only the owner may read owner/check
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function detectRole(u){
  const KEY='sp-role-'+u.uid; let cached=null; try{ cached=localStorage.getItem(KEY); }catch(e){}
  const probe=fs.doc('owner/check').get({source:'server'}).then(()=>'owner',e=>/permission/.test(String(e&&e.code||''))?'seller':null);
  let role=cached?await Promise.race([probe,sleep(5000).then(()=>null)]):await probe;
  role=role||cached||null;
  SP.role=role; if(role) try{ localStorage.setItem(KEY,role); }catch(e){}
  return role;
}

function watchAccess(u){

  },e=>{ if(!appOpen) showWaiting(u,/permission/.test(String(e&&e.code||''))?'rules':'check'); });
}
function recheckAccess(){
  const u=auth&&auth.currentUser; if(!u||wiping) return;

async function wipeDevice(why){
  if(wiping) return; wiping=true;

  try{ sessionStorage.clear(); }catch(e){}
  IMG.forEach(x=>{ try{ if(x.u&&x.u.startsWith('blob:')) URL.revokeObjectURL(x.u); }catch(e){} }); IMG.clear();
  try{ await auth.signOut(); }catch(e){}
  try{ await fs.terminate(); }catch(e){}
  let cleared=false; try{ await fs.clearPersistence(); cleared=true; }catch(e){}
  if(!cleared) try{ if(window.indexedDB&&indexedDB.databases) (await indexedDB.databases()).forEach(d=>{ if(d&&d.name&&/firestore/i.test(d.name)) indexedDB.deleteDatabase(d.name); }); }catch(e){}

}
SP.logout=async()=>{

/* ---------- owner: Moliya → Xodimlar ---------- */
const STAFF=new Map(), REQS=new Map(); let staffOn=false;
function watchStaff(){
  if(staffOn) return; staffOn=true;

}
function when(iso){ const d=new Date(iso||''); if(isNaN(d)) return ''; const z=x=>String(x).padStart(2,'0'); return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()); }
SP.staffPane=()=>{

  const reqs=[...REQS.entries()].filter(([id])=>!STAFF.has(id)).sort((x,y)=>String(y[1].at||'').localeCompare(String(x[1].at||'')));
  const st=[...STAFF.entries()].sort((x,y)=>(y[1].active===true)-(x[1].active===true)||String(x[1].email||'').localeCompare(String(y[1].email||'')));
  let h='<section class="pane sp-staff"><h3 class="h-sm">Xodimlar</h3><p class="muted" style="font-size:13.5px">Sotuvchi oʻz hisobi bilan shu saytga bir marta kiradi, soʻrovi shu yerda chiqadi. “Kirishni oʻchirish” bosilsa, uning qurilmasi bir necha soniyada chiqib ketadi va undagi doʻkon maʼlumotlari oʻchiriladi.</p>';

  if(st.length) h+='<div class="sp-sh">Sotuvchilar</div><ul class="sp-list">'+st.map(([id,x])=>{ const on=x.active===true; return '<li><div class="sp-who"><b>'+esc(x.email||id)+'</b><small class="'+(on?'sp-on':'')+'">'+(on?'● Faol':'○ Kirish oʻchirilgan'+(x.revokedAt?' · '+esc(when(x.revokedAt)):''))+'</small></div><div class="sp-btns">'+(on?b('staff-off',id,'Kirishni oʻchirish','danger'):b('staff-on',id,'Qayta ruxsat berish')+b('staff-del',id,'Roʻyxatdan olib tashlash'))+'</div></li>'; }).join('')+'</ul>';
  if(!reqs.length&&!st.length) h+='<p class="muted" style="font-size:13.5px">Hali sotuvchi yoʻq. Sotuvchi hisobini Firebase → Authentication boʻlimida oching va u shu saytga kirsin.</p>';

function staffAct(a,uid){
  const now=new Date().toISOString(), x=STAFF.get(uid)||{}, r=REQS.get(uid)||{}, who=x.email||r.email||uid;
  const fail=e=>{ const c=mapErr(e).code; toast('Saqlanmadi ('+(c==='permission_denied'?'ruxsat yoʻq':c)+').',true); };
  if(a==='staff-ok'){ fs.doc('staff/'+uid).set({email:r.email||'',active:true,at:now,by:SP.user.email||''}).then(()=>fs.doc('joinreq/'+uid).delete()).catch(fail); toast('Ruxsat berildi: '+who); }
  else if(a==='staff-no'){ fs.doc('joinreq/'+uid).delete().catch(fail); }
  else if(a==='staff-off'){ if(!window.confirm(who+' kirishini oʻchirasizmi?\n\nUning qurilmasi bir necha soniyada chiqib ketadi va undagi doʻkon maʼlumotlari oʻchiriladi.')) return; fs.doc('staff/'+uid).set({active:false,revokedAt:now},{merge:true}).catch(fail); toast('Kirish oʻchirildi: '+who); }
  else if(a==='staff-on'){ fs.doc('staff/'+uid).set({active:true,at:now,by:SP.user.email||''},{merge:true}).catch(fail); toast('Ruxsat berildi: '+who); }
  else if(a==='staff-del'){ if(!window.confirm(who+' roʻyxatdan olib tashlansinmi? U keyin yana soʻrov yubora oladi.')) return; fs.doc('staff/'+uid).delete().catch(fail); }
  rerender();
}

/* ---------- events for gate + backup controls ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest&&e.target.closest('[data-sp]'); if(!el) return;
  const a=el.getAttribute('data-sp');
  if(a==='reload') location.reload();
  else if(a==='save-cfg'){ const c=parseCfg(document.getElementById('sp-cfg').value); if(!c){ showSetup('Matndan apiKey, projectId va appId topilmadi. firebaseConfig ni toʻliq nusxalang.'); return; } try{ localStorage.setItem(CFG_KEY,JSON.stringify(c)); }catch(err){} location.reload(); }
  else if(a==='reset-cfg'){ try{ localStorage.removeItem(CFG_KEY); }catch(err){} location.reload(); }
  else if(a==='diag-close'){ diagClosed=true; hideDiag(); }
  else if(/^staff-/.test(a)) staffAct(a,el.getAttribute('data-uid'));
  else if(a==='longpoll'){ try{ localStorage.setItem(LP_KEY,'1'); }catch(err){} location.reload(); }
  else if(a==='copy-uid'){ const uid=auth&&auth.currentUser?auth.currentUser.uid:''; try{ await navigator.clipboard.writeText(uid); el.textContent='Nusxa olindi'; }catch(err){ const c=document.querySelector('.sp-uid'); if(c){ const r=document.createRange(); r.selectNodeContents(c); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } } }
  else if(a==='export') SP.exportAll();
  else if(a==='logout') SP.logout();
});
document.addEventListener('change',async e=>{
  const t=e.target; if(!t||!t.hasAttribute||!t.hasAttribute('data-sp-import')) return;

});
document.addEventListener('submit',async e=>{
  if(!e.target||e.target.id!=='sp-login') return;
  e.preventDefault();
  const email=document.getElementById('sp-email').value.trim(), pass=document.getElementById('sp-pass').value;
  if(!email||!pass){ showLogin('Email va parolni kiriting.',email); return; }
  const b=document.getElementById('sp-go'); b.disabled=true; b.textContent='Kirilmoqda…';
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(err){ showLogin(authErr(err),email); }
});

/* ---------- start ---------- */
function start(){
  if(typeof window.firebase==='undefined'||!firebase.initializeApp){ showNoSdk(); return; }
  const cfg=readCfg(); if(!cfg){ showSetup(); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ showSetup('Bu sozlama ishlamadi: '+(e&&e.message||e)); return; }
  auth=firebase.auth(); fs=firebase.firestore();
  const fset={ignoreUndefinedProperties:true,merge:true}; if(LP){ fset.experimentalForceLongPolling=true; fset.experimentalAutoDetectLongPolling=false; }
  try{ fs.settings(Object.assign({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED},fset)); }catch(e){ try{ fs.settings(fset); }catch(e2){} }
  try{ fs.enablePersistence({synchronizeTabs:true}).catch(()=>{ persistOk=false; }); }catch(e){ persistOk=false; }
  DBW=makeDb();
  auth.onAuthStateChanged(u=>{
    if(u){ SP.user=u; if(!SP.started){ SP.started=true; hideGate(); watchLive(); loadImages();
      Promise.all([detectRole(u),Promise.race([fs.doc('settings/meta').get().then(d=>{ META=(d&&d.exists&&d.data())||{}; }).catch(()=>{}),sleep(3000)])]).then(([role])=>{
        if(role==='owner'){ openApp(); watchStaff(); }
        else if(role==='seller') watchAccess(u);
        else showWaiting(u,'offline');
      }); } }
    else if(SP.started){ if(!wiping){ let w=''; try{ w=localStorage.getItem('sp-bye')||''; }catch(e){} wipeDevice(w||'gone'); } }
    else showLogin();
  });
}
start();
})();
</script>

function dayKey(d){ d=d||new Date(); const z=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function addDays(k,n){ const a=k.split('-').map(Number); return dayKey(new Date(a[0],a[1]-1,a[2]+n)); }

function atomOptions(sel){
  sel=atomKey(sel);
  const o=(k,label)=>'<option value="'+esc(k)+'"'+(sel===k?' selected':'')+'>'+esc(label)+'</option>';
  const prods=[...S.products.entries()].filter(([id,p])=>!isLiquid(p)&&(isAtomProd(p)||sel==='p:'+id)).sort(byName);
  const mats=[...S.materials.entries()].filter(([id,m])=>(m.unit||'pcs')==='pcs').sort(byName);
  let h='<option value="">Yoʻq</option>';
  if(prods.length) h+='<optgroup label="Mahsulotlar">'+prods.map(([id,p])=>o('p:'+id,p.name+' · '+plainMoney(p.price)+' · '+q1(p.qty)+' ta')).join('')+'</optgroup>';
  if(mats.length) h+='<optgroup label="Materiallar">'+mats.map(([id,m])=>o('m:'+id,m.name+' · '+(num(m.price)>0?plainMoney(m.price):'tannarx '+plainMoney(m.cost))+' · '+q1(m.stock)+' ta')).join('')+'</optgroup>';
  return h;
}
function atomField(val,bind,id){ const a=atomRef(val); return '<div class="field"><label for="'+id+'">Ml sotuvi uchun atomayzer</label><select id="'+id+'" data-bind="'+bind+'">'+atomOptions(val)+'</select><span class="hint">'+(a?'Ml sotuvida oʻzi tanlanadi. Tannarxi '+money(a.cost)+(a.price>0?', sotish narxi '+money(a.price):'')+'. Sotuvda narx bilan yoki sovgʻa qilib berish mumkin.':'Quyma atir solinadigan atomayzer. Atomayzerlarni “Mahsulotlar”ga “Atomayzer” turi bilan qoʻshing.')+'</span></div>'; }
function debtLeft(x){ return Math.max(0,num(x.total)-num(x.paid)); }
function debtState(x){ if(debtLeft(x)<0.5) return 'paid'; const t=dayKey(); if((x.due||'')<t) return 'overdue'; if(x.due===t) return 'today'; return 'open'; }
function debtOk(){ const c=S.cust; return c.name.trim().length>0&&c.phone.replace(/\D/g,'').length>=7&&!!c.due&&c.due>=dayKey(); }
function tipAttr(t,rows){ return ' data-tip="'+esc(JSON.stringify({t,rows}))+'"'; }

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,tone){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast'+(tone==='bad'?' bad':''); el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.hidden=true; },tone==='bad'?5200:2400); }
function errText(e){
  const c=e&&e.code;
  if(c==='permission_denied') return 'Ruxsat yoʻq. Bu email Firebase qoidalarida yozilmagan boʻlishi mumkin.';
  if(c==='not_found') return 'Bu yozuv topilmadi. U boshqa qurilmada oʻchirilgan boʻlishi mumkin.';
  if(c==='invalid_argument') return 'Oʻzgarish saqlanmadi: maʼlumot notoʻgʻri.';
  if(c==='quota_exceeded') return 'Doʻkon xotirasi toʻldi. Eski maʼlumotlarni oʻchirib, qayta urinib koʻring.';
  if(c==='resource_exhausted') return 'Bir vaqtda juda koʻp oʻzgarish. Bir necha soniya kutib, qayta urinib koʻring.';
  if(c==='revoked') return 'Sahifa ochiq turganda doʻkonga kirish huquqi oʻzgardi.';
  return 'Saqlab boʻlmadi. Internetni tekshirib, qayta urinib koʻring.';
}

/* ---------- writes ---------- */
async function retry(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await sleep(400+Math.random()*600); return await fn(); } throw e; } }
function enqueue(fn){ const p=writeChain.then(fn); writeChain=p.catch(()=>{}); return p; }
async function run(fn,okMsg){
  if(!canWrite()){ toast(S.noDb?'Oʻzgarishlarni saqlash uchun tizimga kiring.':'Bu doʻkonni faqat koʻra olasiz, oʻzgartira olmaysiz.','bad'); return false; }
  S.busy=true; render();
  try{ await enqueue(fn); if(okMsg) toast(okMsg); return true; }
  catch(e){ if(e&&e.code==='permission_denied'&&!isSeller()) S.readOnly=true; if(e&&e.code==='revoked') S.dead=true; toast(errText(e),'bad'); return false; }
  finally{ S.busy=false; render(); }
}
// stock fields go to the database as +/- changes measured from the state the change was planned on (base);
// base===false = an absolute count someone typed in
function incPatch(cur,base,f,keys){ if(base===false||!DB||!DB.inc) return [f,f]; const b=base||cur, loc=Object.assign({},f), srv=Object.assign({},f); keys.forEach(k=>{ if(k in f&&typeof f[k]==='number'&&typeof b[k]==='number'){ const d=rnd(f[k]-b[k]); srv[k]=DB.inc(d); loc[k]=rnd(num(cur[k])+d); } }); return [loc,srv]; }
function fixNums(d,keys){ if(!d) return d; keys.forEach(k=>{ if(typeof d[k]==='number') d[k]=rnd(d[k]); }); return d; }
async function patchProduct(id,f,base){ const p=S.products.get(id); if(!p) return; const [loc,srv]=incPatch(p,base,f,['sealed','openMl','qty']); S.products.set(id,Object.assign({},p,loc)); await retry(()=>DB.doc('products/'+id).update(srv)); }
async function setProduct(id,doc){ S.products.set(id,doc); await retry(()=>DB.doc('products/'+id).set(doc)); }
async function patchMaterial(id,f,base){ const m=S.materials.get(id); if(!m) return; const [loc,srv]=incPatch(m,base,f,['stock']); S.materials.set(id,Object.assign({},m,loc)); await retry(()=>DB.doc('materials/'+id).update(srv)); }
async function setMaterial(id,doc){ S.materials.set(id,doc); await retry(()=>DB.doc('materials/'+id).set(doc)); }
// every inventory change goes through here so it is logged
async function moveMats(moves){
  const by=new Map();
  moves.forEach(m=>{ if(!m.mid||!m.delta) return; if(!by.has(m.mid)) by.set(m.mid,[]); by.get(m.mid).push(m); });
  for(const [mid,list] of by){
    const mat=S.materials.get(mid); if(!mat) continue;
    let stock=num(mat.stock); const log=(mat.log||[]).slice(); const t=new Date().toISOString(); let cost=null;
    list.forEach(m=>{ stock=rnd(stock+m.delta); log.push({t,type:m.type,d:rnd(m.delta),bal:stock,note:m.note||''}); if(m.cost!=null) cost=m.cost; });
    const f={stock,log:log.slice(-300)}; if(cost!=null) f.cost=rnd(cost);
    await patchMaterial(mid,f,list.some(x=>x.type==='adjust')?false:undefined);
  }
}
async function addSaleItems(items){
  const k=dayKey(), id=k+'_'+DEVICE, c=S.sales.get(id);
  const doc={day:k,device:DEVICE,items:[...((c&&c.items)||[]),...items]};
  S.sales.set(id,doc); await retry(()=>DB.union?DB.doc('sales/'+id).set({day:k,device:DEVICE,items:DB.union(...items)},{merge:true}):DB.doc('sales/'+id).set(doc));
}

/* ---------- planning ---------- */
// one cart line against the product's current state
function planLine(p,l,work){
  const r={warn:[],uses:[],opened:0,filled:0,n:0,ml:0,patch:{}};
  if(!isLiquid(p)){
    const n=Math.max(0,Math.floor(num(l.n))); r.kind='piece'; r.n=n;
    r.list=n*num(p.price); r.cost=n*num(p.cost); r.patch={qty:num(p.qty)-n};
    if(n>num(p.qty)) r.err=num(p.qty)>0?'Faqat '+q1(p.qty)+' ta bor':'Qolmagan';
  } else if(l.kind==='bottle'){
    const n=Math.max(0,Math.floor(num(l.n))), bm=num(p.bottleMl);
    r.kind='bottle'; r.n=n; r.ml=n*bm;
    let sealed=num(p.sealed), open=num(p.openMl);
    if(sealed>=n) sealed-=n;
    else{
      const have=Math.max(0,sealed), short=n-have;
      if(isHand(p)&&open>=short*bm){ open=rnd(open-short*bm); sealed-=have; r.filled=short; (p.pack||[]).forEach(x=>r.uses.push({mid:x.mid,delta:-num(x.amt)*short,type:'fill',note:p.name})); }
      else { sealed-=n; r.err=(have>0?'Faqat '+q1(have)+' ta yangi shisha bor':'Yangi shisha qolmagan')+(open>0&&num(p.priceMl)>0?' · ochiq shishadan ml boʻyicha sotish mumkin ('+q1(open)+' ml)':''); }
    }
    r.list=n*num(p.priceBottle); r.cost=n*bottleCost(p); r.patch={sealed,openMl:open};
  } else {
    const m=Math.max(0,num(l.ml)), bm=num(p.bottleMl);
    r.kind='ml'; r.ml=m;
    let sealed=num(p.sealed), open=num(p.openMl);
    while(open<m&&sealed>0&&bm>0){ sealed--; open+=bm; r.opened++; }
    if(open<m) r.err=open>0?'Faqat '+q1(open)+' ml bor':'Qolmagan';
    open=rnd(open-m);
    r.mlList=m*num(p.priceMl); r.mlCost=m*costMl(p); r.list=r.mlList; r.cost=r.mlCost;
    const a=l.cont?atomRef(l.cont,work):null;
    if(a){
      const sp=str(l.atomPrice).trim()!==''?Math.max(0,num(l.atomPrice)):a.price, gift=!!l.gift||sp<=0, ap=gift?0:sp;
      r.atom={key:a.key,k:a.k,id:a.id,name:a.name,cost:a.cost,price:ap,sellPrice:sp,gift};
      r.list+=ap; r.cost+=a.cost;
      if(a.stock<1) r.err=(r.err?r.err+' · ':'')+a.name+' qolmagan: boshqasini yoki “Yoʻq”ni tanlang';
      if(a.k==='m') r.uses.push({mid:a.id,delta:-1,type:'sale',note:p.name+' '+q1(m)+' ml'});
      else r.atomPatch={id:a.id,qty:a.stock-1};
    }
    r.patch={sealed,openMl:open};
  }
  return r;
}
function stockLeft(p){ if(!isLiquid(p)) return {n:Math.max(0,num(p.qty)),ml:0,bottles:0}; const bm=num(p.bottleMl), sealed=Math.max(0,num(p.sealed)), open=Math.max(0,num(p.openMl)); return {bottles:sealed+(isHand(p)&&bm>0?Math.floor(open/bm):0),ml:open+sealed*bm,n:0}; }
function soldOut(p){ const s=stockLeft(p); return isLiquid(p)?(s.ml<=0&&s.bottles<=0):s.n<=0; }
function stockState(p){ return soldOut(p)?'out':isLow(p)?'low':''; }
function cartBad(cp){ return cp.lines.some(x=>x.missing||(x.r&&x.r.err)); }
function cartPlan(){
  const work=new Map(), lines=[]; let list=0,cost=0; const uses=[];
  S.cart.forEach(l=>{
    const base=work.get(l.pid)||S.products.get(l.pid);
    if(!base){ lines.push({l,missing:true}); return; }
    const r=planLine(base,l,work); work.set(l.pid,Object.assign({},base,r.patch));
    if(r.atomPatch){ const ab=work.get(r.atomPatch.id)||S.products.get(r.atomPatch.id); if(ab) work.set(r.atomPatch.id,Object.assign({},ab,{qty:r.atomPatch.qty})); }
    lines.push({l,p:base,r}); list+=r.list; cost+=r.cost; r.uses.forEach(u=>uses.push(u));
  });
  const disc=Math.min(Math.max(0,num(S.discount)),list);
  lines.forEach(x=>{ if(x.r) x.price=list>0?x.r.list-disc*x.r.list/list:0; });
  const total=list-disc;
  return {lines,work,uses,list,disc,total,cost,profit:total-cost};
}
function lineDesc(kind,n,ml,opened,gift){
  let t='';
  if(kind==='bottle') t=n+' '+plural(n,'shisha','shisha')+(ml?' · '+q1(ml)+' ml':'');
  else if(kind==='ml') t=q1(ml)+' ml'+(opened?' · '+opened+' ta yangi ochildi':'');
  else if(kind==='piece'||kind==='atom') t=n+' dona';
  else if(kind==='writeoff') t='Hisobdan chiqarildi '+q1(ml)+' ml';
  return t+(gift?' · sovgʻa':'');
}
function planBatch(p,mk){
  const X=Math.max(0,num(mk.ml)), N=Math.max(0,Math.floor(num(mk.fill))), bm=num(p.bottleMl);
  const need=new Map(); const add=(mid,a)=>{ if(!mid||!a) return; need.set(mid,(need.get(mid)||0)+a); };
  let liq=0,pk=0;
  (p.recipe||[]).forEach(r=>{ const a=num(r.amt)*X/100; add(r.mid,a); liq+=a*matCost(r.mid); });
  (p.pack||[]).forEach(r=>{ const a=num(r.amt)*N; add(r.mid,a); pk+=a*matCost(r.mid); });
  const oldLiquid=num(p.openMl)+Math.max(0,num(p.sealed))*bm, oldCost=costMl(p);
  const newCostMl=(oldLiquid+X)>0?(oldLiquid*oldCost+liq)/(oldLiquid+X):oldCost;
  const open=rnd(num(p.openMl)+X-N*bm), sealed=num(p.sealed)+N;
  const warn=[];
  if(X>0&&!(p.recipe||[]).length) warn.push('Hali retsept yoʻq. Tannarx toʻgʻri boʻlishi uchun retsept qoʻshing.');
  if(open<0) warn.push('Suyuqlik yetmaydi: '+N+' ta shishani toʻldirib boʻlmaydi.');
  const rows=[...need.entries()].map(([mid,a])=>{ const have=S.materials.get(mid)?num(S.materials.get(mid).stock):0; return {mid,name:matName(mid),unit:matUnit(mid),need:a,have,short:a>have}; });
  if(rows.some(r=>r.short)) warn.push('Baʼzi materiallar yetmaydi. Ularning soni noldan pastga tushadi.');
  return {X,N,liq,pk,total:liq+pk,newCostMl,open,sealed,rows,warn,ok:(X>0||N>0)&&open>=0};
}

/* ---------- reports data ---------- */
function allItems(from,to){
  const out=[];
  for(const [id,d] of S.sales){ if(!d||!d.day) continue; if(from&&d.day<from) continue; if(to&&d.day>to) continue; (d.items||[]).forEach(it=>out.push(Object.assign({_doc:id,_day:d.day},it))); }
  out.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  return out;
}
function receiptsOf(items){
  const m=new Map();
  items.forEach(it=>{ const k=it.rid||it.id; if(!m.has(k)) m.set(k,{rid:k,t:it.t,pay:it.pay,items:[]}); m.get(k).items.push(it); });
  return [...m.values()].sort((a,b)=>String(b.t).localeCompare(String(a.t)));
}
function periodRange(){
  const t=dayKey(), a=t.split('-').map(Number);
  switch(S.rp){
    case 'today': return [t,t];
    case 'yesterday': { const y=addDays(t,-1); return [y,y]; }
    case 'month': return [t.slice(0,8)+'01',t];
    case 'lastmonth': return [dayKey(new Date(a[0],a[1]-2,1)),dayKey(new Date(a[0],a[1]-1,0))];
    case '12m': return [dayKey(new Date(a[0],a[1]-12,1)),t];
    case 'custom': { let f=S.rFrom||t, e=S.rTo||t; if(f>e){ const x=f; f=e; e=x; } return [f,e]; }
    default: return [addDays(t,-6),t];
  }
}
function summarize(items){
  const s={rev:0,cost:0,wo:0,byCat:{},kind:{bottle:{rev:0,cost:0,n:0,ml:0},ml:{rev:0,cost:0,ml:0,opened:0},piece:{rev:0,cost:0,n:0}},pay:{},byProd:{}};
  items.forEach(it=>{
    const price=num(it.price), cost=num(it.cost);
    if(it.kind==='writeoff'){ s.wo+=cost; s.cost+=cost; return; }
    s.rev+=price; s.cost+=cost;
    const c=s.byCat[it.cat]||(s.byCat[it.cat]={rev:0,profit:0}); c.rev+=price; c.profit+=price-cost;
    const k=s.kind[it.kind==='atom'?'piece':it.kind]; if(k){ k.rev+=price; k.cost+=cost; if(it.kind==='ml'){ k.ml+=num(it.ml); k.opened+=num(it.opened); } else { k.n+=num(it.n); if(it.kind==='bottle') k.ml+=num(it.ml); } }
    s.pay[it.pay||'cash']=(s.pay[it.pay||'cash']||0)+price;
    const key=it.pid||(it.mid?'m:'+it.mid:it.name); const pr=s.byProd[key]||(s.byProd[key]={name:it.name,cat:it.cat,rev:0,profit:0,bottles:0,ml:0,b:{n:0,rev:0,cost:0},m:{ml:0,rev:0,cost:0}});
    pr.rev+=price; pr.profit+=price-cost; if(it.kind==='bottle'){ pr.bottles+=num(it.n); pr.ml+=num(it.ml); pr.b.n+=num(it.n); pr.b.rev+=price; pr.b.cost+=cost; } if(it.kind==='ml'){ pr.ml+=num(it.ml); pr.m.ml+=num(it.ml); pr.m.rev+=price; pr.m.cost+=cost; }
  });
  s.profit=s.rev-s.cost;
  s.receipts=receiptsOf(items.filter(i=>i.kind!=='writeoff')).length;
  return s;
}
function buckets(items,from,to){
  const sold=items.filter(i=>i.kind!=='writeoff');
  let keys=[],keyOf,label;
  if(from===to){
    let lo=9,hi=21; sold.forEach(i=>{ const h=new Date(i.t).getHours(); lo=Math.min(lo,h); hi=Math.max(hi,h); });
    for(let h=lo;h<=hi;h++) keys.push(String(h));
    keyOf=i=>String(new Date(i.t).getHours()); label=k=>String(k).padStart(2,'0')+':00';
  } else {
    const days=Math.round((dateOf(to)-dateOf(from))/864e5)+1;
    if(days<=62){ for(let k=from;k<=to;k=addDays(k,1)) keys.push(k); keyOf=i=>i._day; label=k=>shortDay(k); }
    else { let d=dateOf(from); d=new Date(d.getFullYear(),d.getMonth(),1); while(dayKey(d)<=to){ keys.push(dayKey(d).slice(0,7)); d=new Date(d.getFullYear(),d.getMonth()+1,1); } keyOf=i=>i._day.slice(0,7); label=k=>{ const m=UZMS[dateOf(k+'-01').getMonth()]; return m[0].toUpperCase()+m.slice(1); }; }
  }
  const m=new Map(keys.map(k=>[k,{k,label:label(k),rev:0,profit:0,n:0}]));
  sold.forEach(i=>{ const b=m.get(keyOf(i)); if(b){ b.rev+=num(i.price); b.profit+=num(i.price)-num(i.cost); } });
  receiptsOf(sold).forEach(r=>{ const b=m.get(keyOf(r.items[0])); if(b) b.n++; });
  return [...m.values()];
}

/* ---------- charts ---------- */
function colChart(bs,title){
  const top=Math.max(0,...bs.map(b=>Math.max(b.rev,b.profit)));
  const stepV=niceMax(top/4)||1, max=Math.max(stepV,Math.ceil(top/stepV)*stepV);
  const ticks=[]; for(let v=0;v<=max+1e-6;v+=stepV) ticks.push(v);
  let peak=-1,pv=0; bs.forEach((b,i)=>{ if(b.rev>pv){ pv=b.rev; peak=i; } });
  const step=Math.max(1,Math.ceil(bs.length/8));
  const y='<div class="yaxis" aria-hidden="true">'+ticks.map(t=>'<span style="bottom:'+(t/max*100)+'%">'+compact(t)+'</span>').join('')+'</div>';
  const grid=ticks.slice(1).map(t=>'<span class="gl" style="bottom:'+(t/max*100)+'%"></span>').join('');
  const cols=bs.map((b,i)=>{
    const h1=b.rev/max*100, h2=Math.max(0,b.profit)/max*100;
    return '<div class="band" tabindex="0" role="listitem" aria-label="'+esc(b.label+': tushum '+plainMoney(b.rev)+', foyda '+plainMoney(b.profit))+'"'+tipAttr(b.label,[['s1','Tushum',plainMoney(b.rev)],['s2','Foyda',plainMoney(b.profit)],['','Sotuvlar',String(b.n)]])+'><i class="b1" style="height:'+h1+'%"></i><i class="b2" style="height:'+h2+'%"></i>'+(i===peak&&pv>0?'<span class="peak" style="--h:'+h1+'%">'+compact(b.rev)+'</span>':'')+'</div>';
  }).join('');
  const xs=bs.map((b,i)=>'<span>'+(i%step===0?esc(b.label):'')+'</span>').join('');
  return '<div class="legend"><span><i style="background:var(--s1)"></i>Tushum</span><span><i style="background:var(--s2)"></i>Foyda</span></div><div class="colchart" role="group" aria-label="'+esc(title)+'">'+y+'<div class="plot">'+grid+'<div class="cols" role="list">'+cols+'</div></div><div class="xaxis" aria-hidden="true">'+xs+'</div></div>';
}
function hbars(rows,fmt){
  if(!rows.length||rows.every(r=>!(r.v>0))) return '<div class="empty" style="padding:18px">Bu davrda sotuv yoʻq.</div>';
  const max=Math.max(...rows.map(r=>r.v));
  return '<div class="hbars" role="list">'+rows.map(r=>'<div class="hrow" tabindex="0" role="listitem"'+tipAttr(r.label,r.tip||[['s1',r.name||'Tushum',plainMoney(r.v)]])+'><span class="hl">'+esc(r.label)+'</span><span class="htrack"><i class="hb" style="--w:'+(max>0?Math.max(0,r.v)/max:0)+'"></i><span class="hv">'+(fmt?fmt(r):money(r.v))+'</span></span></div>').join('')+'</div>';
}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(){
  const a=document.activeElement, id=a&&a.id; let ss=null,se=null;
  try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){}
  const sb=document.querySelector('.sheet-body'); const sheetScroll=sb?sb.scrollTop:0;
  app.innerHTML=viewHeader()+'<main class="wrap">'+viewTab()+'</main>'+viewCartBar()+viewBotNav()+(S.sheet?viewSheet():'');
  const nb=document.querySelector('.sheet-body'); if(nb) nb.scrollTop=sheetScroll;
  if(id){ const el=document.getElementById(id); if(el&&el!==document.activeElement){ try{ el.focus({preventScroll:true}); }catch(e){} try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
  hideTip();
}
function tabButtons(short){ let od=0; for(const x of S.debts.values()) if(debtState(x)==='overdue') od++; return (isSeller()?SELLER_TABS:TABS).map(([k,l])=>'<button class="tab" role="tab" type="button" data-act="tab" data-arg="'+k+'" aria-selected="'+(S.tab===k)+'"'+(short&&SHORT[k]?' aria-label="'+l+'"':'')+'>'+icon(k)+'<span>'+(short&&SHORT[k]?SHORT[k]:l)+'</span>'+(k==='debts'&&od?'<span class="cnt" aria-label="'+od+' ta muddati oʻtgan">'+od+'</span>':'')+'</button>').join(''); }
function viewHeader(){
  let st;

function catChips(key,list,extra){
  const counts={}; list.forEach(p=>{ counts[p.cat]=(counts[p.cat]||0)+1; });

function brandKey(b){ return String(b||'').trim().toLowerCase().replace(/\s+/g,' '); }
function brandOk(p,sel){ return !sel||(sel==='__none'?!brandKey(p.brand):brandKey(p.brand)===sel); }
function brandNames(){ const m=new Map(); for(const p of S.products.values()){ const nm=String(p.brand||'').trim().replace(/\s+/g,' '); if(!nm) continue; const k=brandKey(nm); const e=m.get(k)||{}; e[nm]=(e[nm]||0)+1; m.set(k,e); } const out=new Map(); m.forEach((e,k)=>out.set(k,Object.entries(e).sort((a,b)=>b[1]-a[1]||(/^\p{Lu}/u.test(b[0])-/^\p{Lu}/u.test(a[0]))||a[0].localeCompare(b[0]))[0][0])); return out; }
function brandSelect(key,list){
  const sel=S[key]||'', names=brandNames(), cnt=new Map();
  list.forEach(p=>{ const k=brandKey(p.brand)||'__none'; cnt.set(k,(cnt.get(k)||0)+1); });
  if(sel&&!cnt.has(sel)) cnt.set(sel,0);
  const lab=k=>k==='__none'?'Brendsiz':(names.get(k)||k);
  const keys=[...cnt.keys()].sort((a,b)=>a==='__none'?1:b==='__none'?-1:lab(a).localeCompare(lab(b),undefined,{sensitivity:'base'}));
  return '<span class="bsel'+(sel?' on':'')+'"><select id="'+key+'-sel" data-bind="'+key+'" aria-label="Brend boʻyicha saralash"><option value="">Barcha brendlar</option>'+keys.map(k=>'<option value="'+esc(k)+'"'+(sel===k?' selected':'')+'>'+esc(lab(k))+' · '+cnt.get(k)+'</option>').join('')+'</select></span>';
}
function brandDatalist(){ return '<datalist id="brand-list">'+[...brandNames().values()].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'})).map(n=>'<option value="'+esc(n)+'"></option>').join('')+'</datalist>'; }
function matchQ(p,q){ q=q.trim().toLowerCase(); return !q||((p.name||'')+' '+(p.brand||'')).toLowerCase().includes(q); }
function searchBox(id,bind,val,ph){ return '<div class="search grow">'+icon('search')+'<input id="'+id+'" type="text" data-bind="'+bind+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'" autocomplete="off"></div>'; }

/* ----- Debts ----- */
function viewDebts(){
  const all=[...S.debts.entries()].map(([id,x])=>Object.assign({id,st:debtState(x)},x));
  const owed=all.reduce((a,x)=>a+debtLeft(x),0);

  const list=all.filter(x=>S.dcat==='all'||(S.dcat==='open'?x.st!=='paid':S.dcat==='overdue'?x.st==='overdue':x.st==='paid')).filter(x=>!q||((x.name||'')+' '+(x.phone||'')).toLowerCase().includes(q))
    .sort((a,b)=>a.st==='paid'&&b.st==='paid'?String(b.t).localeCompare(String(a.t)):(a.st==='paid')-(b.st==='paid')||String(a.due).localeCompare(String(b.due)));
  let h='<div class="head"><h2 class="h">Nasiya</h2><span class="owed">Sizga qarz<b>'+money(owed)+'</b></span></div>';
  h+='<div class="toolbar"><div class="row">'+searchBox('debt-q','dq',S.dq,'Ism yoki telefon boʻyicha qidirish')+'</div><div class="chips" role="group" aria-label="Saralash">'+F.map(([k,l])=>'<button class="chip" type="button" data-act="chip" data-arg="dcat|'+k+'" aria-pressed="'+(S.dcat===k)+'">'+l+'</button>').join('')+'</div></div>';
  if(!loaded()&&!S.noDb) return h+loadingBlock();
  if(!list.length) return h+'<div class="pane"><div class="empty">'+(all.length?'Bu yerda hech narsa yoʻq.':'<b>Nasiya yoʻq</b><span>Savatda toʻlov turini <b style="font-size:inherit">Nasiya</b> qilib tanlang va mijozning ismi, telefoni hamda toʻlashga vaʼda bergan sanasini kiriting.</span>')+'</div></div>';
  return h+'<div class="debts">'+list.map(debtCard).join('')+'</div>';
}
function debtCard(x){
  const left=debtLeft(x), st=x.st;
  const pill=st==='paid'?'<span class="pill ok">Toʻlangan</span>':st==='overdue'?'<span class="pill neg">Muddati oʻtgan · '+esc(shortDay(x.due))+'</span>':st==='today'?'<span class="pill low">Bugun toʻlashi kerak</span>':'<span class="pill">Muddat: '+esc(shortDay(x.due))+'</span>';
  const fm=S.dform&&S.dform.id===x.id?S.dform:null;
  let h='<section class="pane debt st-'+st+'"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="nm">'+esc(x.name)+'</div><div class="row" style="gap:6px"><span class="ph">'+esc(x.phone)+'</span><button class="linkbtn" type="button" data-act="copy" data-arg="'+esc(x.phone)+'">Nusxalash</button></div></div>'+pill+'</div>';
  h+='<div class="its">'+(x.items||[]).map(i=>esc(i.name)+' · '+esc(i.desc)).join('<br>')+'<br>Sotilgan: '+esc(shortDay(x.day||String(x.t).slice(0,10)))+'</div>';
  h+='<div class="kv3"><div><span>Jami</span><b>'+money(x.total)+'</b></div><div><span>Toʻlangan</span><b>'+money(x.paid)+'</b></div><div><span>Qoldi</span><b class="'+(left>0?'bad':'good')+'">'+money(left)+'</b></div></div>';
  if((x.payments||[]).length) h+='<ul class="moves">'+x.payments.slice().reverse().map(pm=>'<li><span>'+esc(PAY[pm.m]||pm.m)+'<span class="w" style="display:block">'+esc(whenOf(pm.t))+'</span></span><span class="d plus">+'+money(pm.amount)+'</span></li>').join('')+'</ul>';
  if(st!=='paid'){
    if(fm&&fm.mode==='pay') h+='<div class="debtbox">'+f('dp-amt','Hozir toʻlangan summa','dform.amt',fm.amt,{mode:'numeric'})+'<div class="seg" role="group" aria-label="Toʻlov turi">'+PAYS.map(([k,l])=>'<button type="button" data-act="debt-m" data-arg="'+k+'" aria-pressed="'+(fm.m===k)+'">'+l+'</button>').join('')+'</div><div class="row"><button class="btn primary" type="button" data-act="debt-pay"'+(num(fm.amt)>0?dis():' disabled')+'>Toʻlovni saqlash</button><button class="btn ghost" type="button" data-act="debt-cancel">Bekor qilish</button></div></div>';
    else if(fm&&fm.mode==='date') h+='<div class="debtbox"><div class="field"><label for="dd-due">Yangi vaʼda sanasi</label><input id="dd-due" type="date" data-bind="dform.due" value="'+esc(fm.due)+'" min="'+dayKey()+'"></div><div class="row"><button class="btn primary" type="button" data-act="debt-date"'+(fm.due&&fm.due>=dayKey()?dis():' disabled')+'>Sanani saqlash</button><button class="btn ghost" type="button" data-act="debt-cancel">Bekor qilish</button></div></div>';
    else h+='<div class="row"><button class="btn primary small" type="button" data-act="debt-form" data-arg="'+esc(x.id)+'|pay"'+dis()+'>Toʻlov qabul qilish</button><button class="btn small" type="button" data-act="debt-form" data-arg="'+esc(x.id)+'|date"'+dis()+'>Sanani oʻzgartirish</button></div>';
  }
  return h+'</section>';
}

/* ----- Expenses & orders ----- */
function orderLeft(o){ return Math.max(0,num(o.total)-num(o.paid)); }
function monthLabel(ym){ const a=ym.split('-').map(Number); const m=UZM[a[1]-1]; return m[0].toUpperCase()+m.slice(1)+' '+a[0]; }
function addMonths(ym,n){ const a=ym.split('-').map(Number); const d=new Date(a[0],a[1]-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function itemInfo(key){
  const i=String(key||'').indexOf(':'); if(i<0) return null; const t=key.slice(0,i), id=key.slice(i+1);
  if(t==='p'){ const p=S.products.get(id); if(!p) return null; return {type:'product',id,name:p.name,unit:isLiquid(p)?'shisha':'dona',cost:isLiquid(p)?Math.round(bottleCost(p)):num(p.cost)}; }
  if(t==='m'){ const m=S.materials.get(id); if(!m) return null; return {type:'material',id,name:m.name,unit:UL(m.unit||'pcs'),cost:num(m.cost)}; }
  return null;
}
function viewExpenses(){
  let h='<div class="head"><h2 class="h">Xarajatlar</h2><div class="seg" role="group" aria-label="Boʻlim" style="min-width:min(300px,100%)">'+[['exp','Xarajatlar'],['ord','Buyurtmalar']].map(([k,l])=>'<button type="button" data-act="xtab" data-arg="'+k+'" aria-pressed="'+(S.xtab===k)+'">'+l+'</button>').join('')+'</div></div>';
  if(!loaded()&&!S.noDb) return h+loadingBlock();
  return h+(S.xtab==='ord'?ordersBody():expensesBody());
}
function expensesBody(){
  const ym=S.xmonth||dayKey().slice(0,7);
  const list=[...S.expenses.entries()].filter(([id,x])=>String(x.day||'').slice(0,7)===ym).sort((a,b)=>String(b[1].day).localeCompare(String(a[1].day))||String(b[1].t).localeCompare(String(a[1].t)));
  const tot=list.reduce((a,[id,x])=>a+num(x.amount),0);
  let h='<div class="toolbar"><div class="row between"><div class="row" style="flex-wrap:nowrap"><button class="btn small" type="button" data-act="xmonth" data-arg="-1" aria-label="Oldingi oy">‹</button><b style="min-width:128px;text-align:center">'+esc(monthLabel(ym))+'</b><button class="btn small" type="button" data-act="xmonth" data-arg="1" aria-label="Keyingi oy"'+(ym>=dayKey().slice(0,7)?' disabled':'')+'>›</button></div><button class="btn primary" type="button" data-act="new-expense"'+dis()+'>+ Xarajat qoʻshish</button></div><span class="owed">Shu oy jami<b>'+money(tot)+'</b></span></div>';
  if(!list.length) return h+'<div class="pane"><div class="empty"><b>Bu oyda xarajat yoʻq</b><span>Ijara, ish haqi, kommunal, soliq va boshqa xarajatlarni shu yerga yozing.</span></div></div>';
  return h+'<div class="irows">'+list.map(([id,x])=>'<button class="irow" type="button" data-act="edit-expense" data-arg="'+esc(id)+'"><span><span class="nm">'+esc(EXPC[x.cat]||x.cat||'Boshqa')+'</span>'+(x.note?' <span class="muted">· '+esc(x.note)+'</span>':'')+'<span class="sub" style="display:block">'+esc(dayLabel(x.day))+' · '+esc(PAY[x.pay]||x.pay||'')+'</span></span><span class="q">'+money(x.amount)+'</span></button>').join('')+'</div>';
}
function ordersBody(){
  const all=[...S.orders.entries()].map(([id,o])=>Object.assign({id},o));
  const F=[['open','Kutilmoqda'],['unpaid','Toʻlanmagan'],['received','Qabul qilingan'],['all','Hammasi']];
  const list=all.filter(o=>S.ocat==='all'||(S.ocat==='open'?o.status!=='received':S.ocat==='received'?o.status==='received':orderLeft(o)>=0.5)).sort((a,b)=>String(b.t).localeCompare(String(a.t)));

  if(!list.length) return h+'<div class="pane"><div class="empty">'+(all.length?'Bu yerda hech narsa yoʻq.':'<b>Hali buyurtma yoʻq</b><span>Yetkazib beruvchidan atir, dezodorant yoki materiallarga buyurtma bering. Tovar kelganda “Qabul qilish”ni bosing, qoldiq oʻzi koʻpayadi.</span>')+'</div></div>';
  return h+'<div class="debts">'+list.map(orderCard).join('')+'</div>';
}
function orderCard(o){
  const left=orderLeft(o), rec=o.status==='received', fm=S.oform&&S.oform.id===o.id?S.oform:null;
  const pill=rec?'<span class="pill ok">Qabul qilindi · '+esc(shortDay(o.receivedDay||o.day))+'</span>':'<span class="pill low">Kutilmoqda'+(o.expected?' · '+esc(shortDay(o.expected)):'')+'</span>';

  h+='<div class="its">'+(o.lines||[]).map(l=>esc(l.name)+' · '+q1(l.qty)+' '+esc(l.unitLabel||'')+' × '+money(l.cost)).join('<br>')+'</div>';

  if((o.payments||[]).length) h+='<ul class="moves">'+o.payments.slice().reverse().map(pm=>'<li><span>'+esc(PAY[pm.m]||pm.m)+'<span class="w" style="display:block">'+esc(whenOf(pm.t))+'</span></span><span class="d">−'+money(pm.amount)+'</span></li>').join('')+'</ul>';
  if(fm&&fm.mode==='pay') h+='<div class="debtbox">'+f('op-amt','Toʻlanadigan summa','oform.amt',fm.amt,{mode:'numeric'})+'<div class="seg" role="group" aria-label="Toʻlov turi">'+PAYS.map(([k,l])=>'<button type="button" data-act="of-m" data-arg="'+k+'" aria-pressed="'+(fm.m===k)+'">'+l+'</button>').join('')+'</div><div class="row"><button class="btn primary" type="button" data-act="of-pay"'+(num(fm.amt)>0?dis():' disabled')+'>Toʻlovni saqlash</button><button class="btn ghost" type="button" data-act="of-cancel">Bekor qilish</button></div></div>';
  else if(fm&&fm.mode==='del') h+='<div class="row"><button class="btn danger solid small" type="button" data-act="of-del"'+dis()+'>Buyurtmani oʻchirish</button><button class="btn ghost small" type="button" data-act="of-cancel">Qoldirish</button></div>';
  else h+='<div class="row">'+(!rec?'<button class="btn primary small" type="button" data-act="of-receive" data-arg="'+esc(o.id)+'"'+dis()+'>Qabul qilish</button>':'')+(left>=0.5?'<button class="btn small" type="button" data-act="of-form" data-arg="'+esc(o.id)+'|pay"'+dis()+'>Toʻlov qilish</button>':'')+(!rec?'<button class="btn ghost small" type="button" data-act="of-form" data-arg="'+esc(o.id)+'|del">Oʻchirish</button>':'')+'</div>';
  return h+'</section>';
}

/* ----- Reports ----- */
function viewReports(){
  const [from,to]=periodRange();
  const items=allItems(from,to), s=summarize(items);
  const inR=d=>d&&d>=from&&d<=to;
  let expT=0; const expBy={}; for(const x of S.expenses.values()) if(inR(x.day)){ expT+=num(x.amount); expBy[x.cat]=(expBy[x.cat]||0)+num(x.amount); }
  let supPaid=0, recT=0, pendN=0, pendV=0, supOwe=0; const recBy={};
  for(const o of S.orders.values()){ (o.payments||[]).forEach(pm=>{ if(inR(pm.day||dayKey(new Date(pm.t)))) supPaid+=num(pm.amount); }); if(o.status==='received'&&inR(o.receivedDay)){ recT+=num(o.total); const k=o.supplier||'Yetkazib beruvchi'; recBy[k]=(recBy[k]||0)+num(o.total); } if(o.status!=='received'){ pendN++; pendV+=num(o.total); } supOwe+=orderLeft(o); }
  let cashSales=0; items.forEach(it=>{ if(it.kind!=='writeoff'&&it.pay!=='debt') cashSales+=num(it.price); });
  let debtIn=0; for(const x of S.debts.values()) (x.payments||[]).forEach(pm=>{ if(inR(pm.day||dayKey(new Date(pm.t)))) debtIn+=num(pm.amount); });
  const net=s.profit-expT, cashIn=cashSales+debtIn, cashOut=expT+supPaid;
  let owed=0,owedN=0,overN=0; for(const x of S.debts.values()){ const l=debtLeft(x); if(l>=0.5){ owed+=l; owedN++; if(debtState(x)==='overdue') overN++; } }
  const P=[['today','Bugun'],['yesterday','Kecha'],['7d','7 kun'],['month','Shu oy'],['lastmonth','Oʻtgan oy'],['12m','12 oy'],['custom','Sana']];
  let h='<div class="head"><h2 class="h">Moliya</h2></div><div class="toolbar"><div class="chips" role="group" aria-label="Davr">'+P.map(([k,l])=>'<button class="chip" type="button" data-act="rp" data-arg="'+k+'" aria-pressed="'+(S.rp===k)+'">'+l+'</button>').join('')+'</div>';
  if(S.rp==='custom') h+='<div class="row" style="flex-wrap:wrap"><div class="field" style="width:170px"><label for="r-from">Dan</label><input id="r-from" type="date" data-bind="rFrom" value="'+esc(S.rFrom)+'"></div><div class="field" style="width:170px"><label for="r-to">Gacha</label><input id="r-to" type="date" data-bind="rTo" value="'+esc(S.rTo)+'"></div></div>';
  h+='<span class="hint">'+esc(from===to?dayLabel(from):dayLabel(from)+' – '+dayLabel(to))+'</span></div>';
  h+='<div class="kpis"><div class="kpi"><span class="lbl">Tushum</span><b>'+money(s.rev)+'</b><small>'+s.receipts+' ta sotuv · oʻrtacha '+money(s.receipts?s.rev/s.receipts:0)+'</small></div><div class="kpi"><span class="lbl">Yalpi foyda</span><b class="'+(s.profit<0?'bad':'')+'">'+money(s.profit)+'</b><small>tushum − tovar tannarxi · marja '+pct(s.profit,s.rev)+'</small></div><div class="kpi"><span class="lbl">Xarajatlar</span><b>'+money(expT)+'</b><small>ijara, ish haqi va boshqalar</small></div><div class="kpi"><span class="lbl">Sof foyda</span><b class="'+(net<0?'bad':'good')+'">'+money(net)+'</b><small>yalpi foyda − xarajatlar · '+pct(net,s.rev)+'</small></div></div>';
  h+='<div class="kpis"><div class="kpi"><span class="lbl">Pul kirimi</span><b>'+money(cashIn)+'</b><small>sotuvlar va nasiya toʻlovlari</small></div><div class="kpi"><span class="lbl">Pul chiqimi</span><b>'+money(cashOut)+'</b><small>xarajatlar va tovar uchun toʻlovlar</small></div><div class="kpi"><span class="lbl">Sizga qarz</span><b class="'+(owedN?'bad':'')+'">'+money(owed)+'</b><small>'+owedN+' ta toʻlanmagan · '+overN+' ta muddati oʻtgan</small></div><div class="kpi"><span class="lbl">Siz qarzdorsiz</span><b class="'+(supOwe>=0.5?'bad':'')+'">'+money(supOwe)+'</b><small>yetkazib beruvchilarga · '+pendN+' ta buyurtma kutilmoqda</small></div></div>';
  h+='<div class="rgrid" style="margin-bottom:16px"><section class="pane"><h3 class="h-sm">Pul oqimi</h3><div class="flow"><div><span>Sotuvlardan (naqd, karta, oʻtkazma)</span><b class="good">+'+money(cashSales)+'</b></div><div><span>Nasiya toʻlovlari</span><b class="good">+'+money(debtIn)+'</b></div><div><span>Xarajatlar</span><b class="bad">'+money(-expT)+'</b></div><div><span>Yetkazib beruvchilarga toʻlov</span><b class="bad">'+money(-supPaid)+'</b></div><div class="tot"><span>Natija</span><b class="'+(cashIn-cashOut<0?'bad':'good')+'">'+(cashIn-cashOut>=0?'+':'')+money(cashIn-cashOut)+'</b></div></div></section>';
  h+='<section class="pane"><h3 class="h-sm">Xarajatlar turlari boʻyicha</h3>'+(expT>0?hbars(EXP_CATS.map(([k,l])=>({label:l,v:expBy[k]||0,tip:[['s1','Xarajat',plainMoney(expBy[k]||0)],['','Ulushi',pct(expBy[k]||0,expT)]]})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v)):'<div class="muted" style="font-size:13.5px">Bu davrda xarajat yozilmagan.</div>')+'</section>';
  const at={sn:0,sr:0,sp:0,gn:0,gc:0}; items.forEach(it=>{ if(it.kind==='writeoff'||!(it.kind==='atom'||it.cat==='atomizer'||it.with)) return; const n=num(it.n)||1; if(it.gift){ at.gn+=n; at.gc+=num(it.cost); } else { at.sn+=n; at.sr+=num(it.price); at.sp+=num(it.price)-num(it.cost); } });
  if(at.sn||at.gn) h+='<section class="pane wide"><h3 class="h-sm">Atomayzerlar</h3><div class="flow"><div><span>Sotildi · '+at.sn+' ta</span><b>'+money(at.sr)+'</b></div><div><span>Sotilganidan foyda</span><b class="'+(at.sp<0?'bad':'good')+'">'+money(at.sp)+'</b></div><div><span>Sovgʻa qilindi · '+at.gn+' ta (tannarxi)</span><b class="'+(at.gc>0?'bad':'')+'">'+money(-at.gc)+'</b></div></div></section>';
  h+='<section class="pane wide"><div class="row between"><h3 class="h-sm">Qabul qilingan tovarlar (xaridlar)</h3><span class="num">'+money(recT)+'</span></div>'+(recT>0?hbars(Object.entries(recBy).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,v,tip:[['s1','Xarid',plainMoney(v)]]}))):'<div class="muted" style="font-size:13.5px">Bu davrda tovar qabul qilinmagan.</div>')+(pendN?'<div class="hint">Kutilayotgan buyurtmalar: '+pendN+' ta, '+money(pendV)+'</div>':'')+'</section></div>';
  const bs=buckets(items,from,to);
